settings.commands.hint=The command runs in a new terminal tab. It gets the issue as environment variables: ISSUE_NUMBER, ISSUE_TITLE, ISSUE_URL, ISSUE_BRANCH and ISSUE_PROMPT.<br>With “Issue branch” ticked, the branch of the issue is checked out before the start. If the issue has no branch, the plugin offers the names for a new one. Leave it unticked for commands that create a worktree of their own.
settings.prompts=Prompt templates
settings.prompts.hint=Select a template to edit its text. The chosen template becomes ISSUE_PROMPT and the text of “Copy as prompt”. Placeholders:<br>{number}: number of the issue<br>{title}: title<br>{url}: URL on GitHub<br>{branch}: branch of the issue, empty if it has none<br>{description}: only the first post, as Markdown: title, a line with link, state, milestone, type, assignees and labels, then author, date and the description<br>{content}: the same as {description}, followed by all comments (up to 100) with author and date<br>Images are included as links. Links to uploaded images only work for a few minutes.
