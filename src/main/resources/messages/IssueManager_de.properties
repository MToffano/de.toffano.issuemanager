settings.commands.hint=Der Befehl läuft in einem neuen Terminal-Tab. Er bekommt das Issue als Umgebungsvariablen: ISSUE_NUMBER, ISSUE_TITLE, ISSUE_URL, ISSUE_BRANCH und ISSUE_PROMPT.<br>Ist „Issue-Branch“ angehakt, wird vor dem Start der Branch des Issues ausgecheckt. Hat das Issue keinen Branch, bietet das Plugin die Namen für einen neuen an. Für Befehle, die selbst einen Worktree anlegen, bleibt der Haken weg.
settings.prompts=Prompt-Vorlagen
settings.prompts.hint=Eine Vorlage auswählen, um ihren Text zu bearbeiten. Die gewählte Vorlage wird zu ISSUE_PROMPT und zum Text von „Als Prompt kopieren“. Platzhalter:<br>{number}: Nummer des Issues<br>{title}: Titel<br>{url}: URL auf GitHub<br>{branch}: Branch des Issues, leer, wenn es keinen hat<br>{description}: nur der erste Beitrag als Markdown: Titel, eine Zeile mit Link, Status, Milestone, Typ, Bearbeitern und Labels, danach Autor, Datum und die Beschreibung<br>{content}: dasselbe wie {description}, danach alle Kommentare (bis zu 100) mit Autor und Datum<br>Bilder sind als Links enthalten. Links zu hochgeladenen Bildern funktionieren nur einige Minuten.
