group = de.toffano.issuemanager
version = 0.3.0

# Gradle runs with the Java runtime bundled with Rider (Java 25), because Rider 2026.3 is compiled for Java 25.
# The path is the one of a default installation of Rider on macOS.
org.gradle.java.home = /Applications/Rider.app/Contents/jbr/Contents/Home

# Do not download JDKs automatically
org.gradle.java.installations.auto-download = false

# Do not bundle the Kotlin standard library, Rider ships it -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
